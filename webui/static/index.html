<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amadeus Challenge Console</title>
    <link rel="icon" type="image/png" href="/imgs/amds-favicon.png?v=amds-logo-3" />
    <link rel="shortcut icon" type="image/png" href="/favicon.ico?v=amds-logo-3" />
    <link rel="apple-touch-icon" href="/imgs/amds-favicon.png?v=amds-logo-3" />
    <link rel="stylesheet" href="/styles.css?v=evidence-jump-1" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-heading">
            <img class="brand-logo" src="/imgs/amds.png" alt="" />
            <div>
              <p class="eyebrow">CTF Toolbox</p>
              <h1>Amadeus</h1>
            </div>
            <button id="theme-toggle" class="button ghost theme-toggle" type="button" aria-label="Toggle color theme">Dark</button>
          </div>
          <p id="server-label" class="brand-copy">Local</p>
        </div>

        <section class="panel stack grow">
          <div class="panel-heading">
            <h2>Challenges</h2>
            <button id="refresh-list" class="button ghost" type="button">Refresh</button>
          </div>
          <label class="field">
            <span>Filter</span>
            <input id="challenge-filter" type="search" placeholder="Search competition or challenge" autocomplete="off" />
          </label>
          <div id="challenge-list" class="challenge-list"></div>
        </section>
      </aside>

      <main class="main">
        <section id="detail" class="detail"></section>
      </main>
    </div>

    <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
    <script type="module" src="/app.js?v=evidence-jump-1"></script>
  </body>
  </html>
