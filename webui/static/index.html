<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amadeus Challenge Console</title>
    <link rel="stylesheet" href="/styles.css?v=grouped-challenges-1" />
  </head>
  <body>
    <div class="background-glow background-glow-a"></div>
    <div class="background-glow background-glow-b"></div>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">CTF Toolbox</p>
          <h1>Amadeus</h1>
          <p class="brand-copy">Challenge Console</p>
        </div>

        <form id="create-form" class="panel stack">
          <div class="panel-heading">
            <h2>New Challenge</h2>
            <span class="badge">init on create</span>
          </div>
          <label class="field">
            <span>Path</span>
            <input id="create-name" name="name" type="text" placeholder="defcon/baby_heap" autocomplete="off" />
          </label>
          <button class="button primary" type="submit">Create</button>
        </form>

        <section class="panel stack grow">
          <div class="panel-heading">
            <h2>Challenges</h2>
            <button id="refresh-list" class="button ghost" type="button">Refresh</button>
          </div>
          <label class="field">
            <span>Filter</span>
            <input id="challenge-filter" type="search" placeholder="Search competition or challenge" autocomplete="off" />
          </label>
          <div id="challenge-list" class="challenge-list"></div>
        </section>
      </aside>

      <main class="main">
        <header class="hero">
          <div>
            <p class="eyebrow">Port 9999</p>
            <h2>Challenge Management First</h2>
          </div>
          <p class="hero-copy">
            Create challenges, initialize solve state, edit core docs, and manage checkpoints from one place.
          </p>
        </header>

        <section id="detail" class="detail"></section>
      </main>
    </div>

    <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
    <script type="module" src="/app.js?v=grouped-challenges-1"></script>
  </body>
  </html>
